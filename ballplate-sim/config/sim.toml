# Rolling-table simulator configuration
#
# The simulator is the OPC UA *server*.  The PLC (CODESYS Data Source Manager,
# or any OPC UA client) connects to it.  Only the eight INT words below are
# exposed; all other parameters and commands are set from the Godot UI.

[opcua]
# mode = "hub": all simulations share ONE OPC UA server (plc-hub, port 4840, all tags in ns=2), started automatically by the
# first simulation.  mode = "standalone": this simulation runs its own server on `endpoint` (used by the tests / development).
mode          = "hub"
endpoint      = "opc.tcp://0.0.0.0:4840"
namespace_uri = "urn:ballplate:simulation"
# 0 = give each client exactly the publishing interval it asks for.  A value > 0 caps it (default 20):
# a client that asks for 1000 ms is then served every 20 ms (keep-alive/lifetime are scaled so its
# time-outs stay the same).  Use when the PLC's OPC UA client refuses to go below 1 s.
publishing_interval_cap_ms = 20
# Optional user/password.  Leave out for anonymous access (first tests).
# username = "plc"
# password = "change-me"

[sim]
cycle_ms      = 10      # OPC UA exchange + visualisation period
physics_dt_ms = 1       # integrator step (cycle_ms must be a multiple)
comm_loss_levels_table = true   # no OPC UA client connected -> table levels itself

[table]
size_m          = 2.0     # square, +-1 m
ball_radius_m   = 0.06    # 12 cm diameter
ball_mass_kg    = 0.5
wall_height_m   = 0.12
wall_thickness_m = 0.003   # visual only: the physical wall is the table edge (+-size/2)
tilt_max_deg    = 15.0
tilt_rate_deg_s = 60.0
tilt_tau_s      = 0.05

# Defaults for values that can be changed live in the Godot UI
[contact]
mu_s    = 0.35      # static friction (UI: "Static friction")
mu_k    = 0.25      # dynamic friction (UI: "Dynamic friction")
c_rr    = 0.002     # rolling resistance
e_wall  = 0.6       # elasticity (UI); a NEGATIVE value removes the walls
mu_wall = 0.2

[limits]
limit_velocity = false  # clamp ball velocity to [vel_min, vel_max] (UI checkbox)

# Raw word scaling.  The PLC must use the same ranges to convert back.
[scaling]
raw_max   = 32000       # raw INT range is +-raw_max
tilt_deg  = 15.0        # F_YR10 / F_YR20: +-raw_max  <->  +-tilt_deg
accel_ms2 = 9.81        # F_XG10 / F_XG20: +-raw_max  <->  +-accel_ms2 (negative allowed)
dist_m    = 1.0         # F_XG12 / F_XG22: +-raw_max  <->  +-dist_m
vel_min   = -0.4        # F_XG11 / F_XG21: vel_min..vel_max <-> -raw_max..+raw_max
vel_max   = 0.4         # (vel range is editable in the Godot UI)

[visual]
host         = "127.0.0.1"   # where Godot listens for state (UDP)
port         = 9870
command_port = 9871          # where the simulator listens for Godot's UI commands
enabled      = true

# Test aids for the PLC (all off by default; the Godot panel overrides them while running)
[imperfections]
noise_pos_mm       = 0.0     # noise on the distance words (std dev)
noise_vel_mms      = 0.0     # noise on the velocity words
noise_acc_ms2      = 0.0     # noise on the acceleration words
feedback_delay_ms  = 0.0     # delay of all feedback words
quantisation_bits  = 16      # effective resolution of the feedback words (16 = full)
tilt_dead_time_ms  = 0.0     # dead time of the tilt command
tilt_backlash_deg  = 0.0     # play in the tilt mechanism
tilt_offset_x_deg  = 0.0     # calibration offset of the tilt
tilt_offset_y_deg  = 0.0

[faults]
kicks_per_min             = 0.0   # random pushes of the ball
kick_speed_ms             = 0.3   # push size (velocity change)
feedback_freezes_per_min  = 0.0   # stuck sensor / communication drop
feedback_freeze_s         = 1.0
actuator_sticks_per_min   = 0.0   # tilt actuator holds its last command
actuator_stick_s          = 1.0
