# Traffic intersection simulator (two crossing roads, vehicles and pedestrians; PLC controls the signals)
#
# The simulator is the OPC UA *server*; the PLC connects as a client (CODESYS Data Source Manager).
# Only the 29 Bool IOs are exposed; traffic and fault settings are set in the Godot UI.

[opcua]
endpoint      = "opc.tcp://0.0.0.0:4844"
namespace_uri = "urn:intersectionsim:simulation"
publishing_interval_cap_ms = 20      # serves slow PLC clients faster; 0 = off (see ballplate-sim README)
# username = "plc"
# password = "change-me"

[sim]
cycle_ms = 10
seed = 0                             # random traffic: 0 = different every start, else repeatable

# Defaults for values that can be changed live in the Godot UI
[traffic]
rate_w = 6.0           # vehicles per minute from the west arm (drives east)
rate_e = 6.0
rate_n = 6.0
rate_s = 6.0
v0 = 10.0              # desired speed m/s
runner_prob = 0.0      # share of vehicles that ignore the signal
ped_rate_1 = 4.0       # pedestrians per minute, group 1 (walk along direction 1, over the north/south crosswalks)
ped_rate_2 = 4.0
ped_speed = 1.3

[visual]
host         = "127.0.0.1"   # where Godot listens for state (UDP)
port         = 9878
command_port = 9879          # where the simulator listens for Godot's UI commands
enabled      = true
